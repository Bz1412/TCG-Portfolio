<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG Thai Collection</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24">

    <!-- Header & Summary -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-5 rounded-b-3xl shadow-md">
        <div class="max-w-md mx-auto">
            <h1 class="text-xl font-bold mb-1">⚡ โปเกมอนการ์ด คอลเลกชัน</h1>
            <p class="text-xs text-blue-100 mb-4">ระบบจัดการการ์ดภาษาไทยและราคาตลาด</p>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/20">
                    <p class="text-xs text-blue-200">จำนวนการ์ดทั้งหมด</p>
                    <p id="total-cards" class="text-lg font-bold">0 ใบ</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/20">
                    <p class="text-xs text-blue-200">มูลค่ารวมประเมิน</p>
                    <p id="total-price" class="text-lg font-bold">฿0</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Search & Filter -->
        <div class="flex gap-2">
            <input type="text" id="search-input" placeholder="ค้นหาชื่อการ์ด หรือซีรีส์..." 
                class="w-full px-4 py-3 bg-white rounded-2xl shadow-sm border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                oninput="filterCards()">
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-10 text-slate-400 text-sm">
            กำลังโหลดข้อมูลจาก Google Sheets...
        </div>

        <!-- Card Grid -->
        <div id="card-grid" class="grid grid-cols-2 gap-3">
            <!-- ข้อมูลการ์ดจะแสดงที่นี่ -->
        </div>
    </main>

    <!-- Modal ฟอร์มเพิ่มการ์ดใหม่ -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 space-y-4 max-h-[90vh] overflow-y-auto animate-slide-up">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="font-bold text-lg text-slate-800">✨ เพิ่มการ์ดใหม่เข้าคอลเลกชัน</h2>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <form id="add-form" onsubmit="submitCard(event)" class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-slate-600">ชื่อการ์ด</label>
                    <input type="text" id="card-name" required placeholder="เช่น Charizard ex" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">ซีรีส์ / ชุด (Set)</label>
                    <input type="text" id="card-set" required placeholder="เช่น SV3s" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-semibold text-slate-600">ราคาตลาด (บาท)</label>
                        <input type="number" id="card-price" required placeholder="0" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600">จำนวนที่มี</label>
                        <input type="number" id="card-qty" required value="1" min="1" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">ลิงก์รูปภาพ (Image URL)</label>
                    <input type="url" id="card-image" placeholder="https://..." class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <button type="submit" id="submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold text-sm shadow-md transition duration-200 mt-4">
                    บันทึกข้อมูล
                </button>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-3 px-6 shadow-lg max-w-md mx-auto rounded-t-2xl flex justify-around items-center z-40">
        <button onclick="loadData()" class="flex flex-col items-center text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="text-[10px] mt-1 font-medium">หน้าแรก</span>
        </button>
        <button onclick="toggleModal(true)" class="flex flex-col items-center text-slate-400 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            <span class="text-[10px] mt-1 font-medium">เพิ่มการ์ด</span>
        </button>
    </nav>

    <!-- Script จัดการระบบ -->
    <script>
        // ** ใส่ Web App URL ที่ได้จากการ Deploy Google Apps Script ที่นี่ **
        const API_URL = "https://script.google.com/macros/s/AKfycbyxUtqszvNC3tsfCnp2pH2dMJplBRX6KKX1f-JqzK3q57aAylJ3BOkGEFUJ0bxAI8e-/exec";
        
        let allCards = [];

        async function loadData() {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'block';
            
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result.status === "success") {
                    allCards = result.data;
                    renderCards(allCards);
                    updateSummary(allCards);
                } else {
                    alert("เกิดข้อผิดพลาดในการโหลดข้อมูล: " + result.message);
                }
                loadingEl.style.display = 'none';
            } catch (error) {
                loadingEl.innerText = "ไม่สามารถเชื่อมต่อกับฐานข้อมูลได้ กรุณาตรวจสอบ API_URL";
            }
        }

        function renderCards(cards) {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';

            if (cards.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-slate-400 py-6 text-sm">ไม่พบการ์ดในคอลเลกชัน</div>';
                return;
            }

            cards.forEach(card => {
                const imgSrc = card.image ? card.image : 'https://via.placeholder.com/150?text=No+Image';
                grid.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                        <div>
                            <img src="${imgSrc}" alt="${card.name}" class="w-full h-36 object-contain mb-2 rounded-xl bg-slate-50" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                            <h2 class="text-xs font-bold text-slate-700 truncate">${card.name}</h2>
                            <p class="text-[10px] text-slate-400 mb-1">Set: ${card.set}</p>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-100">
                                <span class="text-xs font-semibold text-blue-600">฿${Number(card.price || 0).toLocaleString()}</span>
                                <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded-full text-slate-600 font-medium">มี ${card.qty} ใบ</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function updateSummary(cards) {
            const totalCards = cards.reduce((sum, card) => sum + Number(card.qty || 0), 0);
            const totalPrice = cards.reduce((sum, card) => sum + (Number(card.price || 0) * Number(card.qty || 0)), 0);

            document.getElementById('total-cards').innerText = `${totalCards} ใบ`;
            document.getElementById('total-price').innerText = `฿${totalPrice.toLocaleString()}`;
        }

        function filterCards() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const filtered = allCards.filter(card => 
                String(card.name).toLowerCase().includes(keyword) || String(card.set).toLowerCase().includes(keyword)
            );
            renderCards(filtered);
        }

        function toggleModal(isOpen) {
            const modal = document.getElementById('add-modal');
            if (isOpen) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        async function submitCard(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "กำลังบันทึก...";

            const newCard = {
                name: document.getElementById('card-name').value,
                set: document.getElementById('card-set').value,
                price: document.getElementById('card-price').value,
                qty: document.getElementById('card-qty').value,
                image: document.getElementById('card-image').value
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // ป้องกันปัญหา CORS ของ Google Apps Script
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newCard)
                });

                // เนื่องจากโหมด no-cors จะอ่าน response ไม่ได้ ให้ถือว่าสำเร็จแล้วรีเซ็ตฟอร์ม
                alert("บันทึกการ์ดเรียบร้อยแล้ว!");
                document.getElementById('add-form').reset();
                toggleModal(false);
                
                // โหลดข้อมูลใหม่หลังจากบันทึก (รอสัก 1 วินาทีให้ Google Sheet บันทึกเสร็จ)
                setTimeout(loadData, 1500);

            } catch (error) {
                alert("เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่อีกครั้ง");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "บันทึกข้อมูล";
            }
        }

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        loadData();
    </script>
</body>
</html>
